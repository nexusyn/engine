# Smithery configuration for Nexusyn MCP Server
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: "Nexusyn API Key"
        description: "Your Nexusyn API Key from https://app.nexusyn.ai/dashboard (optional for local/self-host)"
  commandFunction: |-
    (config) => ({
      command: "nexus",
      args: ["mcp"],
      env: config.apiKey ? { NEXUS_API_KEY: config.apiKey } : {}
    })

description: "Long-term persistent memory for AI agents with hybrid search (DiskANN + FTS), bi-temporal knowledge graph, and 81.1% LongMemEval accuracy."
iconUrl: "https://nexusyn.ai/favicon.ico"
tags:
  - memory
  - agents
  - knowledge-graph
  - long-term-memory
  - context

