# Smithery configuration for Nexusyn MCP Server
# https://smithery.ai/docs/config

startCommand:
  type: http
  url: "https://api.nexusyn.ai/v1/mcp"
  headers:
    Authorization: "Bearer ${apiKey}"
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        title: "API Key"
        description: "Your Nexusyn API Key from https://app.nexusyn.ai/dashboard"

description: "Long-term persistent memory for AI agents with hybrid search (DiskANN + FTS), bi-temporal knowledge graph, and 81.1% LongMemEval accuracy."
iconUrl: "https://nexusyn.ai/favicon.ico"
tags:
  - memory
  - agents
  - knowledge-graph
  - long-term-memory
  - context
