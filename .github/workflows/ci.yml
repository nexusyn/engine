name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigas quando push novo chega
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # ───── 1. Build + unit tests ─────
  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod ou go.sum desatualizados — rode 'go mod tidy' e commit."
            exit 1
          fi

      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      - name: Coverage report
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

  # ───── 2. Lint ─────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --timeout=5m

  # ───── 3. Integration tests (Postgres real via testcontainers) ─────
  test-integration:
    name: Test (integration)
    runs-on: ubuntu-latest
    needs: test  # só roda se unit passou
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Integration tests
        run: make test-integration

      - name: RLS leak test (mandatory)
        run: make test-rls

  # ───── 4. Docker build (sanity check) ─────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build nexus image
        run: docker build -f docker/Dockerfile.nexus -t nexus:ci .

      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t nexus-dashboard:ci .

      - name: Image sizes
        run: docker images | grep -E "^nexus(:|-)"
